name: Aletheia 
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: newslens/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r newslens/backend/requirements.txt

      - name: Run pipeline
        working-directory: newslens/backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER || 'local' }}
          MAX_CLUSTERS: ${{ secrets.MAX_CLUSTERS || '10' }}
          MIN_CLUSTER_SIZE: '2'
        run: python pipeline.py

      - name: Commit updated database
        run: |
          git config user.name "NewsLens Bot"
          git config user.email "newslens@github-actions"
          git add newslens/data/newslens.db
          git diff --staged --quiet || git commit -m "chore: daily pipeline run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push